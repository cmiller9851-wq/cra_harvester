name: CRA Harvester Node Validation
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-and-anchor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Sovereign Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Type-check and build canonical service
        run: |
          npm run check
          npm run build
